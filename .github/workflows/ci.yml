name: CI

permissions: { contents: read }

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}

jobs:
  format-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- --deny warnings

  spell-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - name: Download Codebook
        env:
          CODEBOOK_VERSION: v0.3.41
          CODEBOOK_SHA256: f4cad62804fd2cbe0766f4cdbda9b446568c9ef75fd1af3337f43b4ec8901148
        run: |
          cd "${RUNNER_TEMP:?}"
          curl -fsSLo codebook.tar.gz "https://github.com/blopker/codebook/releases/download/${CODEBOOK_VERSION:?}/codebook-lsp-aarch64-unknown-linux-musl.tar.gz"
          echo "${CODEBOOK_SHA256:?}  codebook.tar.gz" | sha256sum -c
          tar -xzf codebook.tar.gz

      - name: Check spelling
        run: |
          git ls-files -z | xargs -0 "${RUNNER_TEMP:?}/codebook-lsp" lint

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  all-checks:
    runs-on: ubuntu-24.04-arm
    permissions: {}
    needs: [format-check, lint, spell-check, test]
    steps:
      - run: echo "All checks passed!"
